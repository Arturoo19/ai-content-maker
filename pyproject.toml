[project]
name = "ai-content-maker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artur", email = "132137116+Arturoo19@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.4",
]

[project.scripts]
ai-content-maker = "ai_content_maker:main"
ai-content-maker-publish-due = "ai_content_maker.jobs.publish_due:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
